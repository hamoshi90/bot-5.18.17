# [NEW 17] تشغيل: docker compose up -d --build
services:
  bot:
    build: .
    container_name: finance-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot-data:/data

  api:
    build: .
    container_name: finance-api
    restart: unless-stopped
    env_file: .env
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - bot-data:/data
    depends_on:
      - bot

volumes:
  bot-data:
